const editor=document.createElement('div');editor.className='note-editor';editor.innerHTML='<label>示例照片笔记（仅本次预览）<select aria-label="选择笔记照片"></select><textarea aria-label="手动填写照片笔记" placeholder="手动填写后，放大地图悬停这张照片可查看"></textarea></label><small>默认没有笔记；此处不保存到真实旅行记录。</small>';document.querySelector('aside').appendChild(editor);
const photoSelect=editor.querySelector('select'),noteInput=editor.querySelector('textarea');
function refreshEditor(c){const old=photoSelect.value;photoSelect.innerHTML=Array.from({length:c.count},(_,i)=>'<option value="'+i+'">照片 '+(i+1)+'</option>').join('');photoSelect.value=Number(old)<c.count?old:'0';if(!photoSelect.value)photoSelect.value='0';noteInput.value=manualNotes.get(c.id+':'+photoSelect.value)||''}
photoSelect.onchange=()=>{noteInput.value=manualNotes.get((selected??0)+':'+photoSelect.value)||'';hideNote()};noteInput.oninput=()=>{manualNotes.set((selected??0)+':'+photoSelect.value,noteInput.value);hideNote()};
function hideNote(){pop.hidden=true;activePhoto=null}
function syncNotes(){if(!enabled||view[2]>180||dragState)hideNote()}
function setCamera(){map.setAttribute('viewBox',view.join(' '));syncNotes()}
function zoomAt(f,x,y){++animation;hideNote();const r=map.getBoundingClientRect(),scale=Math.min(r.width/view[2],r.height/view[3]),ox=(r.width-view[2]*scale)/2,oy=(r.height-view[3]*scale)/2,px=(x-r.left-ox)/scale,py=(y-r.top-oy)/scale,factor=Math.max(4/view[2],Math.min(1600/view[2],f));view=[view[0]+px*(1-factor),view[1]+py*(1-factor),view[2]*factor,view[3]*factor];setCamera()}
map.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(Math.max(-1,Math.min(1,e.deltaY*.002))),e.clientX,e.clientY)},{passive:false});
map.addEventListener('pointerdown',e=>{if(e.button!==0)return;++animation;hideNote();suppressClick=false;const r=map.getBoundingClientRect();dragState={x:e.clientX,y:e.clientY,v:[...view],scale:Math.min(r.width/view[2],r.height/view[3])}});
map.addEventListener('pointermove',e=>{if(dragState){const dx=e.clientX-dragState.x,dy=e.clientY-dragState.y;if(Math.hypot(dx,dy)>4){suppressClick=true;map.setPointerCapture(e.pointerId)};if(suppressClick){view=[dragState.v[0]-dx/dragState.scale,dragState.v[1]-dy/dragState.scale,dragState.v[2],dragState.v[3]];setCamera()}return}const piece=e.target.closest('[data-photo]'),city=e.target.closest('.city-shape');if(!piece||!city||!enabled||view[2]>180){hideNote();return}const text=(manualNotes.get(city.id.replace('area-','')+':'+piece.dataset.photo)||'').trim();if(!text){hideNote();return}activePhoto=piece;pop.textContent=text;pop.hidden=false;pop.style.left=Math.max(8,Math.min(innerWidth-244,e.clientX+16))+'px';pop.style.top=Math.max(8,Math.min(innerHeight-pop.offsetHeight-8,e.clientY+16))+'px'});
map.addEventListener('pointerup',()=>{dragState=null;setTimeout(()=>suppressClick=false,0)});map.addEventListener('pointercancel',()=>{dragState=null;suppressClick=false;hideNote()});map.addEventListener('pointerleave',hideNote);
const cameraControls=document.createElement('div');cameraControls.className='controls';cameraControls.innerHTML='<button aria-label="放大地图">＋</button><button aria-label="缩小地图">−</button>';document.querySelector('.controls').appendChild(cameraControls);cameraControls.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{const r=map.getBoundingClientRect();zoomAt(i?1.4:1/1.4,r.left+r.width/2,r.top+r.height/2)});

for(const f of DATA.background)el('path',{d:f.path,fill:'#d8dfcd',stroke:'#edf0e6','stroke-width':.65,'vector-effect':'non-scaling-stroke'},document.querySelector('#background'));
for(const c of DATA.cities){const root=el('g',{id:'area-'+c.id,transform:`translate(${c.tx},${c.ty}) scale(${c.scale})`,class:'city-shape',role:'button',tabindex:0,'aria-label':'查看'+c.name+'照片拼图'},document.querySelector('#cities'));root.addEventListener('pointerdown',e=>e.preventDefault());root.onclick=()=>{if(!suppressClick&&selected!==c.id)focusCity(c.id)};root.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focusCity(c.id)}};const[x,y,w,h]=c.bounds,marker=el('g',{class:'marker',role:'button',tabindex:0,'aria-label':'放大'+c.name},document.querySelector('#markers'));el('circle',{cx:x+w/2,cy:y+h/2,r:7,fill:'#b84735',stroke:'#f3f1eb','stroke-width':2},marker);el('text',{x:x+w/2+(c.id===3?-42:13),y:y+h/2+(c.id===3?17:-9)},marker).textContent=c.name;marker.addEventListener('pointerdown',e=>e.preventDefault());marker.onclick=()=>{if(!suppressClick)focusCity(c.id)};marker.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focusCity(c.id)}};const b=document.createElement('button');b.id='city-button-'+c.id;b.textContent=c.name+' · '+c.count+' 张';b.onclick=()=>focusCity(c.id);document.querySelector('#city-list').appendChild(b)}
document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{const c=DATA.cities[selected??0];c.count=+b.dataset.count;document.querySelector('#city-button-'+c.id).textContent=c.name+' · '+c.count+' 张';focusCity(c.id)});document.querySelector('#shuffle').onclick=()=>{const c=DATA.cities[selected??0];c.revision=(c.revision||0)+29;focusCity(c.id)};document.querySelector('#puzzle-toggle').onchange=e=>{enabled=e.target.checked;document.querySelector('#caption').textContent=(enabled?'照片拼图已开启':'照片拼图已关闭')+(selected===null?' · 点击城市放大':' · '+DATA.cities[selected].count+' 张示例照片');update()};document.querySelector('#zoom').onclick=()=>{selected=null;document.querySelector('#city-title').textContent='日本旅行地图';document.querySelector('#caption').textContent='点击城市，自动放大并居中';document.querySelector('#markers').style.display='';fly([0,0,800,620]);update()};update();
</script></html>
